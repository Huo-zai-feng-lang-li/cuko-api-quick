# 发布自动构建：打 tag（v*）或手动触发时，在 Windows 上构建单文件 exe 并附到 Release
#
# 触发方式：
#   1) 推送形如 v0.0.1 的 tag  → 自动构建并创建 Release
#   2) 在 GitHub 网页上点 "Run workflow" 手动触发 → 构建并创建 Release（可指定 tag）
#   3) 在网页上创建/编辑 Release 时选 "Publish" → 也会触发（因为 release 事件）
#
# 产物：
#   cuko-api-quick.exe  —— 自带 Node 运行时，目标机不用装 Node
#   使用说明.txt
name: Release EXE

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建/更新的 Release tag（例如 v0.0.1）'
        required: true
        default: 'v0.0.1'

# 同一 tag 的重复触发只保留最新的
concurrency:
  group: release-exe-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write        # 创建 Release、上传附件需要写权限

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # --build-sea 需要 Node >= 25.5
          node-version: '26'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑协议层测试
        run: npm test

      - name: 构建 exe
        run: npm run build:exe

      - name: 校验产物
        shell: pwsh
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $exe = "dist/cuko-api-quick.exe"
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $size = (Get-Item $exe).Length
          Write-Host ("exe 大小: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 50MB) { throw "exe 体积异常（$size 字节），可能构建失败" }
          if (-not (Test-Path "dist/使用说明.txt")) { throw "未生成 使用说明.txt" }

      - name: 冒烟测试（启动 exe 并请求接口）
        shell: pwsh
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:CUKO_HTTP_PORT = "39123"
          $p = Start-Process -FilePath "dist/cuko-api-quick.exe" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:39123/v1/models" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "exe 启动后 /v1/models 无响应" }
            Write-Host "冒烟测试通过: $($r.Content)"

            $h = Invoke-WebRequest -Uri "http://127.0.0.1:39123/" -TimeoutSec 5 -UseBasicParsing
            if ($h.Content -notmatch 'cuko-api-quick') { throw "管理台页面异常" }
            Write-Host "管理台页面正常（$($h.Content.Length) 字节）"

            $info = Invoke-WebRequest -Uri "http://127.0.0.1:39123/api/info" -TimeoutSec 5 -UseBasicParsing
            Write-Host "api/info: $($info.Content)"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: 解析 Release tag
        id: meta
        shell: pwsh
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "无法确定 tag" }
          Write-Host "Release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 重命名产物（带版本号）
        shell: pwsh
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $tag = "${{ steps.meta.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist/cuko-api-quick.exe" "out/cuko-api-quick-$tag.exe"
          Copy-Item "dist/使用说明.txt" "out/使用说明-$tag.txt"
          Get-ChildItem out | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: cuko-api-quick-${{ steps.meta.outputs.tag }}
          path: out/*
          retention-days: 30

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 必须显式指定，否则只更新 Release 正文、不上传任何附件
          files: |
            out/cuko-api-quick-*.exe
            out/使用说明-*.txt
          body: |
            ## cuko-api-quick ${{ steps.meta.outputs.tag }}

            把 **Amazon Quick 网页版**（[quick.aws.com](https://quick.aws.com)）的聊天能力，
            通过 CDP 驱动独立 Chrome，暴露成符合 **Cuko API** 契约的 HTTP/SSE 服务。

            ### 下载

            | 文件 | 说明 |
            |---|---|
            | `cuko-api-quick-${{ steps.meta.outputs.tag }}.exe` | 单文件版，**自带 Node 运行时，目标机不用装 Node**（约 100 MB） |
            | `使用说明-${{ steps.meta.outputs.tag }}.txt` | 快速上手说明 |

            ### 快速开始

            1. 下载 exe，放到一个有写权限的目录（**不要放 Program Files**）
            2. 双击运行，看到 `[Cuko Provider] 运行在 http://127.0.0.1:3000` 就成了
            3. 浏览器打开 <http://127.0.0.1:3000/> 进入管理台
            4. 填模型 ID（如 `quick-main`）+ 显示名称 → 点「添加并启动 Chrome」
            5. 在弹出的 Chrome 窗口里登录 quick.aws.com
            6. 回管理台点「检查」，看到 `ok` 就能用了
            7. 在 Cuckoo 客户端里填 API 地址 `http://127.0.0.1:3000`，协议选 `Cuko API (SSE)`，密钥留空

            ### 环境要求

            - Windows
            - 本机已安装 Chrome
            - 一个能正常登录的 Amazon Quick 账号

            ### 注意

            - exe 未签名，SmartScreen 提示时选「更多信息 → 仍要运行」
            - 换端口：编辑 exe 同级的 `data/config.json` 里的 `port`，重启生效
            - 所有数据（账号、登录态、日志）都在 exe 同级的 `data/` 目录

            > 本项目通过自动化驱动网页界面工作，与 Amazon / AWS 无任何关联，非官方实现。
            > 请仅在你拥有或获得明确授权的账号上使用，并遵守相关服务条款。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
