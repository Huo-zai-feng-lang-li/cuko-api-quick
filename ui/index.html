<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cuko-api-quick 管理台</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff; --ok: #37c07a;
    --warn: #e0a33e; --err: #e05252;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  body.modal-open { overflow: hidden; }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 60px; max-width: 1180px; }
  section { margin-bottom: 26px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .req { color: var(--err); }
  input, select, textarea {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 13px; min-width: 140px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.danger { background: var(--err); }
  button.small { padding: 4px 9px; font-size: 12px; }
  #stopBtn { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; }
  .pill.online { background: rgba(55,192,122,.15); color: var(--ok); }
  .pill.offline { background: rgba(224,82,82,.15); color: var(--err); }
  .pill.muted { background: rgba(139,147,163,.15); color: var(--muted); }
  .pill.warn { background: rgba(224,163,62,.15); color: var(--warn); }

  /* 模型摘要（池大小只在此处出现一次） */
  .pool-summary-bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .pool-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .pool-chip code { font-size: 12px; }
  .pool-member td:first-child { border-left: 3px solid var(--accent); }
  .member-label { font-weight: 600; }

  /* 轻提示（可堆叠） */
  .toast-box { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1200; max-width: 420px; }
  .toast {
    padding: 11px 16px; border-radius: 9px;
    background: var(--panel2); border: 1px solid var(--line); opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--ok); } .toast.err { border-color: var(--err); }

  /* 自定义模态 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1300; padding: 20px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 420px; max-width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .modal-head { padding: 16px 18px 0; font-size: 15px; }
  .modal-body { padding: 12px 18px; font-size: 13px; }
  .modal-body p { margin: 6px 0; }
  .modal-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .modal-input { width: 100%; }
  .modal-error { color: var(--err); font-size: 12px; min-height: 16px; margin-top: 6px; }
  .modal-hint { color: var(--muted); font-size: 12px; }
  .modal-warn { color: var(--warn); }
  .modal-foot { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 10px; }

  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>cuko-api-quick</h1>
  <span class="sub">Amazon Quick 网页版 → Cuko API</span>
  <span class="sub" id="endpoint"></span>
  <button class="danger" id="stopBtn" onclick="stopService()">停止服务</button>
</header>

<main>
  <section>
    <h2>账号（相同「模型别名」自动组成账号池，可并行调度）</h2>
    <div class="card">
      <div class="row">
        <div><label>模型别名 <span class="req">*</span></label><input id="accAlias" placeholder="quick"></div>
        <div><label>配置方案</label><select id="accProfile"></select></div>
        <button onclick="addAccount()">添加并启动 Chrome</button>
      </div>
      <div class="hint">同别名的账号自动组成一个池，可并行调度；内部账号 ID 由服务自动生成。</div>
    </div>
    <div class="card" style="margin-top:12px;padding:0">
      <div id="poolSummary" class="pool-summary-bar" hidden></div>
      <table>
        <thead><tr>
          <th>成员</th><th>模型别名</th><th>端口</th><th>状态</th><th>方案</th><th>健康</th><th style="width:260px">操作</th>
        </tr></thead>
        <tbody id="accRows"><tr><td colspan="7" class="hint">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>配置方案（行为参数）</h2>
    <div class="card">
      <div class="row">
        <div><label>方案名称</label><input id="profName" placeholder="我的方案"></div>
        <button onclick="addProfile()">从默认方案复制新建</button>
        <button class="ghost" onclick="loadProfiles()">刷新</button>
      </div>
      <div class="hint">默认方案不可修改。新建的方案从默认值深拷贝，之后默认方案变化不影响已建方案。</div>
    </div>
    <div id="profList" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>调用方式</h2>
    <div class="card">
      <div class="hint" style="margin-top:0">
        中转地址 <code id="ep2"></code>，Token 留空，模型选择上面的「模型别名」。同一别名下多个账号会自动排队/并行调度。
      </div>
      <pre style="background:var(--panel2);padding:12px;border-radius:8px;overflow:auto;font-size:12px"><code id="curlSample"></code></pre>
    </div>
  </section>
</main>

<div class="toast-box" id="toastBox"></div>

<script>
const $ = (s) => document.querySelector(s);
const API = location.origin;
let PROFILES = { default: null, profiles: [], labels: {} };
let accountsLoading = false;

// ---------- 轻提示（可堆叠，自动消失） ----------
function toast(msg, kind) {
  const box = $('#toastBox');
  const t = document.createElement('div');
  t.className = 'toast show ' + (kind || '');
  t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 5) box.firstChild.remove();
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
  }, 3600);
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API + path, opt);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
  if (!r.ok) throw new Error((data && (data.error || data.message)) || (typeof data === 'string' ? data : r.status));
  return data;
}

// ---------- 自定义模态 ----------
let activeModal = null;

function getFocusables(scope) {
  return [...scope.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}

function trapTab(modal, e) {
  const list = getFocusables(modal);
  if (!list.length) { e.preventDefault(); return; }
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
}

function openModal(opts) {
  if (activeModal) closeModal();
  const trigger = document.activeElement;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">'
    + '<div class="modal-head"><strong id="modalTitle"></strong></div>'
    + '<div class="modal-body"></div>'
    + '<div class="modal-foot"></div>'
    + '</div>';
  const modal = overlay.querySelector('.modal');
  modal.querySelector('#modalTitle').textContent = opts.title;
  const bodyEl = modal.querySelector('.modal-body');
  const footEl = modal.querySelector('.modal-foot');
  if (typeof opts.body === 'string') bodyEl.innerHTML = opts.body; else if (opts.body) bodyEl.appendChild(opts.body);
  if (opts.footer) footEl.appendChild(opts.footer);

  document.body.appendChild(overlay);
  document.body.classList.add('modal-open');

  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); closeModal(); return; }
    if (e.key === 'Tab') trapTab(modal, e);
  };
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', onKey, true);

  activeModal = { overlay, trigger, onKey };

  const focusables = getFocusables(modal);
  let startEl = focusables[0];
  if (opts.defaultFocus === 'cancel') startEl = footEl.querySelector('.ghost') || focusables[focusables.length - 1];
  (startEl || modal).focus();
}

function closeModal() {
  if (!activeModal) return;
  const { overlay, trigger, onKey } = activeModal;
  document.removeEventListener('keydown', onKey, true);
  overlay.remove();
  document.body.classList.remove('modal-open');
  activeModal = null;
  if (trigger && typeof trigger.focus === 'function') trigger.focus();
}

/** 危险确认弹窗：默认焦点在「取消」，确认按钮为危险色。resolve(true/false) */
function confirmDanger({ title, message, warning, confirmLabel }) {
  return new Promise(resolve => {
    const foot = document.createElement('div');
    const cancel = document.createElement('button');
    cancel.className = 'ghost'; cancel.textContent = '取消';
    const confirm = document.createElement('button');
    confirm.className = 'danger'; confirm.textContent = confirmLabel || '确认';
    foot.append(cancel, confirm);

    const body = document.createElement('div');
    body.innerHTML = '<p class="modal-msg"></p>' + (warning ? '<p class="modal-warn"></p>' : '');
    body.querySelector('.modal-msg').textContent = message;
    if (warning) body.querySelector('.modal-warn').textContent = warning;

    let done = false;
    const finish = (v) => { if (done) return; done = true; closeModal(); resolve(v); };
    cancel.onclick = () => finish(false);
    confirm.onclick = () => finish(true);
    openModal({ title, body, footer: foot, defaultFocus: 'cancel' });
  });
}

/** 输入弹窗：Enter 确认、Esc 取消；validate 返回空串表示通过，否则为错误提示。resolve(字符串/null) */
function promptText({ title, value, placeholder, hint, validate }) {
  return new Promise(resolve => {
    const body = document.createElement('div');
    body.innerHTML = '<label class="modal-label" for="modalInput">模型别名</label>'
      + '<input id="modalInput" type="text" class="modal-input" maxlength="80" autocomplete="off">'
      + '<div class="modal-error" role="alert"></div>'
      + (hint ? '<p class="modal-hint"></p>' : '');
    const input = body.querySelector('#modalInput');
    const errEl = body.querySelector('.modal-error');
    input.value = value || '';
    if (placeholder) input.placeholder = placeholder;
    if (hint) body.querySelector('.modal-hint').textContent = hint;

    const foot = document.createElement('div');
    const cancel = document.createElement('button');
    cancel.className = 'ghost'; cancel.textContent = '取消';
    const ok = document.createElement('button');
    ok.textContent = '确认';
    foot.append(cancel, ok);

    let done = false;
    const finish = (v) => { if (done) return; done = true; closeModal(); resolve(v); };
    const submit = () => {
      const v = input.value.trim();
      const err = validate ? validate(v) : '';
      if (err) { errEl.textContent = err; input.focus(); return; }
      finish(v);
    };
    cancel.onclick = () => finish(null);
    ok.onclick = submit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    openModal({ title, body, footer: foot });
    input.focus(); input.select();
  });
}

async function stopService() {
  const ok = await confirmDanger({
    title: '停止服务',
    message: '将关闭本服务托管的 Quick 浏览器页签，并中断正在进行的请求。',
    warning: '不会删除账号、登录态或 data 目录。',
    confirmLabel: '确认停止'
  });
  if (!ok) return;
  const btn = $('#stopBtn');
  if (btn) { btn.disabled = true; btn.textContent = '停止中…'; }
  try {
    await api('POST', '/api/shutdown');
  } catch (_) {
    // 服务可能已经先退出，连接断开也视为停止成功
  }
  toast('服务已停止，浏览器页签正在关闭', 'ok');
  setTimeout(() => {
    document.querySelectorAll('button').forEach(b => { b.disabled = true; });
    const ep = $('#endpoint');
    if (ep) ep.textContent = '服务已停止，请重新启动';
  }, 500);
}

// ---------- 账号 ----------
function groupAccounts(list) {
  const map = new Map();
  list.forEach(a => {
    const alias = a.modelAlias || a.modelId;
    if (!map.has(alias)) map.set(alias, []);
    map.get(alias).push(a);
  });
  const groups = [...map.entries()].map(([alias, members]) => ({
    alias,
    members: members.slice().sort((x, y) => String(x.modelId).localeCompare(String(y.modelId)))
  }));
  groups.sort((a, b) => a.alias.localeCompare(b.alias));
  return groups;
}

// 账号可用性：按健康状态判定，不要求 Chrome 当场在线（需要时自动拉起）。
// 与后端闸门 accountHealthError 对齐：error / login_required / quota_exceeded 不可用；
// 无健康记录或未知状态不扣减。
const UNAVAILABLE_HEALTH = { error: true, login_required: true, quota_exceeded: true };
function isAvailable(a) {
  const st = a.health && a.health.state;
  return !st || !UNAVAILABLE_HEALTH[st];
}

async function loadAccounts() {
  if (accountsLoading) return;
  accountsLoading = true;
  const rows = $('#accRows');
  const summaryBar = $('#poolSummary');
  try {
    const list = await api('GET', '/api/accounts');
    if (!list.length) {
      summaryBar.hidden = true;
      summaryBar.innerHTML = '';
      rows.innerHTML = '<tr><td colspan="7" class="hint">还没有账号，先在上面添加一个。</td></tr>';
      return;
    }
    const groups = groupAccounts(list);
    // 顶部模型摘要：池大小 / 可并行数每个别名只在此处出现一次
    summaryBar.innerHTML = groups.map(g => {
      const poolSize = g.members.length;
      const avail = g.members.filter(isAvailable).length;
      const running = g.members.filter(m => m.active).length;
      const queued = g.members.reduce((s, m) => s + (m.queued || 0), 0);
      const meta = poolSize > 1 ? poolSize + ' 个账号 · 可并行 ' + avail : '';
      const load = (running || queued) ? ' · 当前运行 ' + running + ' / 排队 ' + queued : '';
      return '<span class="pool-chip">模型 <code>' + esc(g.alias) + '</code>'
        + (meta ? '<span> · ' + meta + '</span>' : '')
        + (load ? '<span>' + load + '</span>' : '') + '</span>';
    }).join('');
    summaryBar.hidden = false;

    rows.innerHTML = groups.map(g => g.members.map((a, i) => {
      const health = a.health ? (a.health.state || '-') : '-';
      const healthCls = health === 'ok' ? 'online' : (health === 'login_required' ? 'warn' : (health === '-' ? 'muted' : 'offline'));
      const busy = a.active ? '运行中' : (a.queued ? '排队 ' + a.queued : '空闲');
      const alias = a.modelAlias || a.modelId;
      return '<tr class="pool-member" data-account-id="' + esc(a.modelId) + '" title="内部 ID: ' + esc(a.modelId) + '">'
        + '<td><div class="member-label">账号 ' + (i + 1) + '</div></td>'
        + '<td><code>' + esc(alias) + '</code><div class="hint" style="margin-top:4px">' + esc(busy) + '</div></td>'
        + '<td>' + a.debugPort + '</td>'
        + '<td><span class="pill ' + (a.status === 'online' ? 'online' : 'offline') + '">' + (a.status === 'online' ? '运行中' : '未运行') + '</span></td>'
        + '<td>' + esc(a.profileName || '默认方案') + '</td>'
        + '<td><span class="pill ' + healthCls + '">' + esc(health) + '</span></td>'
        + '<td>'
        + '<button class="small ghost" onclick="editAlias(\'' + esc(a.modelId) + '\', \'' + esc(alias) + '\')">别名</button> '
        + '<button class="small ghost" onclick="openAccount(\'' + esc(a.modelId) + '\')">打开</button> '
        + '<button class="small ghost" onclick="checkHealth(\'' + esc(a.modelId) + '\')">检查</button> '
        + '<button class="small danger" onclick="delAccount(\'' + esc(a.modelId) + '\')">删除</button>'
        + '</td></tr>';
    }).join('')).join('');
  } catch (e) {
    rows.innerHTML = '<tr><td colspan="7" class="hint" style="color:var(--err)">' + esc(e.message) + '</td></tr>';
  } finally {
    accountsLoading = false;
  }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function validAlias(alias) {
  return !alias || /^[a-zA-Z0-9._:-]{1,80}$/.test(alias);
}

async function addAccount() {
  const modelAlias = $('#accAlias').value.trim();
  const profileId = $('#accProfile').value;
  if (!modelAlias) return toast('请填写模型别名', 'err');
  if (!validAlias(modelAlias)) return toast('模型别名仅支持英文、数字、点、下划线、冒号、中划线，最长 80 字符', 'err');
  try {
    const r = await api('POST', '/api/accounts', { modelAlias, profileId });
    $('#accAlias').value = '';
    const newId = r && (r.modelId || (r.account && r.account.modelId));
    toast(newId ? '已创建 内部 ID ' + newId + '，Chrome 正在启动' : '已添加，Chrome 正在启动', 'ok');
    setTimeout(loadAccounts, 1200);
  } catch (e) { toast(e.message, 'err'); }
}

async function editAlias(id, current) {
  const alias = await promptText({
    title: '修改模型别名',
    value: current || '',
    placeholder: '请输入模型别名',
    hint: '同别名的账号会自动组成一个模型池。',
    validate: (v) => validAlias(v) ? '' : '模型别名仅支持英文、数字、点、下划线、冒号、中划线，最长 80 字符'
  });
  if (alias === null) return;
  try {
    await api('PUT', '/api/accounts/' + encodeURIComponent(id), { modelAlias: alias });
    toast('别名已更新，同别名账号会自动成池', 'ok');
    loadAccounts();
  } catch (e) { toast(e.message, 'err'); }
}

async function openAccount(id) {
  try { await api('POST', '/api/accounts/' + encodeURIComponent(id) + '/open'); toast('已启动 Chrome', 'ok'); setTimeout(loadAccounts, 1200); }
  catch (e) { toast(e.message, 'err'); }
}

async function checkHealth(id) {
  toast('检查中…');
  try {
    const r = await api('GET', '/api/accounts/' + encodeURIComponent(id) + '/health');
    toast(id + ' → ' + r.state + (r.message ? '：' + r.message : ''), r.state === 'ok' ? 'ok' : 'err');
    loadAccounts();
  } catch (e) { toast(e.message, 'err'); }
}

async function delAccount(id) {
  const ok = await confirmDanger({
    title: '删除账号',
    message: '账号 ' + id + '：会关闭它的 Chrome，并删除该账号的用户数据目录（登录态）。',
    warning: '此操作不可恢复。',
    confirmLabel: '永久删除'
  });
  if (!ok) return;
  try { await api('DELETE', '/api/accounts/' + encodeURIComponent(id)); toast('已删除', 'ok'); loadAccounts(); }
  catch (e) { toast(e.message, 'err'); }
}

// ---------- 配置方案 ----------
async function loadProfiles() {
  try {
    PROFILES = await api('GET', '/api/profiles');
    const sel = $('#accProfile');
    const cur = sel.value;
    sel.innerHTML = '<option value="default">默认方案</option>'
      + PROFILES.profiles.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('');
    if (cur) sel.value = cur;
    renderProfiles();
  } catch (e) { toast(e.message, 'err'); }
}

function renderProfiles() {
  const labels = PROFILES.labels || {};
  const all = [PROFILES.default].concat(PROFILES.profiles || []);
  $('#profList').innerHTML = all.map(p => {
    const fields = Object.keys(p.values || {}).map(k => {
      const v = p.values[k];
      const label = labels[k] || k;
      if (typeof v === 'boolean') {
        return '<div><label>' + esc(label) + '</label>'
          + '<select data-prof="' + esc(p.id) + '" data-key="' + esc(k) + '"' + (p.isDefault ? ' disabled' : '') + '>'
          + '<option value="true"' + (v ? ' selected' : '') + '>开启</option>'
          + '<option value="false"' + (!v ? ' selected' : '') + '>关闭</option></select></div>';
      }
      return '<div><label>' + esc(label) + '</label>'
        + '<input data-prof="' + esc(p.id) + '" data-key="' + esc(k) + '" value="' + esc(v) + '"' + (p.isDefault ? ' disabled' : '') + '></div>';
    }).join('');
    return '<div class="card" style="margin-bottom:10px">'
      + '<div class="row"><strong>' + esc(p.name) + '</strong>'
      + (p.isDefault ? '<span class="pill muted">默认（只读）</span>' : '')
      + (p.isDefault ? '' : '<button class="small" onclick="saveProfile(\'' + esc(p.id) + '\')">保存</button>'
        + '<button class="small danger" onclick="delProfile(\'' + esc(p.id) + '\')">删除</button>')
      + '</div>'
      + '<details' + (p.isDefault ? '' : '') + '><summary>展开参数（' + Object.keys(p.values || {}).length + ' 个参数）</summary>'
      + '<div class="fields">' + fields + '</div></details>'
      + '</div>';
  }).join('');
}

function collectValues(profId) {
  const out = {};
  document.querySelectorAll('[data-prof="' + profId + '"]').forEach(el => {
    const k = el.getAttribute('data-key');
    let v = el.value;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    else if (v !== '' && !isNaN(Number(v))) v = Number(v);
    out[k] = v;
  });
  return out;
}

async function addProfile() {
  const name = $('#profName').value.trim();
  if (!name) return toast('请填写方案名称', 'err');
  try { await api('POST', '/api/profiles', { name }); $('#profName').value = ''; toast('已创建', 'ok'); loadProfiles(); }
  catch (e) { toast(e.message, 'err'); }
}

async function saveProfile(id) {
  try { await api('PUT', '/api/profiles/' + encodeURIComponent(id), { values: collectValues(id) }); toast('已保存', 'ok'); loadProfiles(); }
  catch (e) { toast(e.message, 'err'); }
}

async function delProfile(id) {
  const ok = await confirmDanger({
    title: '删除配置方案',
    message: '删除后，使用该方案的账号会回退到默认方案。',
    confirmLabel: '删除方案'
  });
  if (!ok) return;
  try { await api('DELETE', '/api/profiles/' + encodeURIComponent(id)); toast('已删除', 'ok'); loadProfiles(); loadAccounts(); }
  catch (e) { toast(e.message, 'err'); }
}
